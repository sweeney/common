name: db

on:
  push:
    branches: [main]
    paths: ['db/**', '.github/workflows/db.yml']
  pull_request:
    branches: [main]
    paths: ['db/**', '.github/workflows/db.yml']

defaults:
  run:
    working-directory: db

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: db/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: db/go.sum

      # Consumers run on 64-bit Linux hosts and Pis, so the module must
      # cross-compile there even though the tests run on amd64.
      - name: Cross-compile for linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build ./...
